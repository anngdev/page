<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NEXUS</title>
<style>
/* Layout: lớp nội dung đặc (danh sách inset grouped, thẻ số liệu) nằm dưới; lớp điều hướng và điều khiển bằng "Liquid Glass"
   nổi phía trên: sidebar dạng tấm kính nổi (màn hình rộng), tab bar dạng viên thuốc nổi (điện thoại), nút, segmented control, sheet, toast.
   Màu theo Apple system colors; Investment = systemTeal, Loan = systemIndigo để hai hệ thống luôn phân biệt được. */
:root{
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30; --gray:#8E8E93;
  --inv:#30B0C7; --loan:#5856D6;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.22); --bg:#F2F2F7; --cell:#FFFFFF;
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  /* Liquid Glass */
  --glass:rgba(255,255,255,.34); --glass-strong:rgba(255,255,255,.62);
  --rim-hi:rgba(255,255,255,.95); --rim-lo:rgba(255,255,255,.18);
  --spec:rgba(255,255,255,.7); --glass-shadow:0 10px 30px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.06);
  --amb1:rgba(48,176,199,.20); --amb2:rgba(88,86,214,.18); --amb3:rgba(255,149,0,.10);
  --shadow:0 20px 60px rgba(0,0,0,.18);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --spring:cubic-bezier(.3,1.45,.45,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --gray:#8E8E93;
  --inv:#40C8E0; --loan:#5E5CE6;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --bg:#000000; --cell:#1C1C1E;
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --glass:rgba(40,40,44,.38); --glass-strong:rgba(36,36,40,.66);
  --rim-hi:rgba(255,255,255,.42); --rim-lo:rgba(255,255,255,.06);
  --spec:rgba(255,255,255,.22); --glass-shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --amb1:rgba(64,200,224,.22); --amb2:rgba(94,92,230,.26); --amb3:rgba(255,159,10,.08);
  --shadow:0 20px 60px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --gray:#8E8E93;
  --inv:#40C8E0; --loan:#5E5CE6;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --bg:#000000; --cell:#1C1C1E;
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --glass:rgba(40,40,44,.38); --glass-strong:rgba(36,36,40,.66);
  --rim-hi:rgba(255,255,255,.42); --rim-lo:rgba(255,255,255,.06);
  --spec:rgba(255,255,255,.22); --glass-shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --amb1:rgba(64,200,224,.22); --amb2:rgba(94,92,230,.26); --amb3:rgba(255,159,10,.08);
  --shadow:0 20px 60px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
/* Ẩn thanh cuộn ở mọi view (ứng dụng dùng chủ yếu trên điện thoại); vẫn cuộn được bằng chạm, chuột và bàn phím */
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.29;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
/* Nền môi trường: màu của hai hệ thống loang nhẹ, để lớp kính có thứ để khúc xạ */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60vmax 50vmax at 8% -5%,var(--amb1),transparent 60%),
             radial-gradient(55vmax 45vmax at 100% 20%,var(--amb2),transparent 60%),
             radial-gradient(50vmax 40vmax at 40% 110%,var(--amb3),transparent 60%),var(--bg)}
button,input,select{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Vật liệu Liquid Glass ---------- */
.glass,.sidebar-panel,.tabbar,.lens,.back,.seg,.thumb,.btn,.chip,.sheet,.toast,.mock-badge,.side a.active{
  position:relative;isolation:isolate;
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur,14px)) saturate(190%) brightness(1.04);
  backdrop-filter:blur(var(--blur,14px)) saturate(190%) brightness(1.04);
  box-shadow:var(--glass-shadow);
}
/* điểm sáng phản chiếu, di chuyển theo con trỏ (--mx, --my do script đặt) */
.glass::before,.sidebar-panel::before,.tabbar::before,.lens::before,.back::before,.seg::before,.thumb::before,.btn::before,.chip::before,.sheet::before,.toast::before,.mock-badge::before,.side a.active::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 100% at var(--mx,28%) var(--my,-20%),var(--spec),transparent 55%);
  opacity:.9;transition:opacity .3s}
/* viền kính: sáng ở cạnh trên–trái và dưới–phải */
.glass::after,.sidebar-panel::after,.tabbar::after,.lens::after,.back::after,.seg::after,.thumb::after,.btn::after,.chip::after,.sheet::after,.toast::after,.mock-badge::after,.side a.active::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(155deg,var(--rim-hi),var(--rim-lo) 30%,transparent 50%,var(--rim-lo) 72%,var(--rim-hi));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
/* phản hồi khi chạm: kính "nảy" như chất lỏng */
.btn,.chip,.back,.tabbar a,.seg button{transition:transform .35s var(--spring),filter .2s}
.btn:active:not(:disabled),.chip:active,.back:active{transform:scale(1.04);filter:brightness(1.08)}
.tabbar a:active,.seg button:active{transform:scale(.94)}
/* khúc xạ nền (Chromium): script thêm class .refract cho <html> */
html.refract .tabbar,html.refract .sidebar-panel,html.refract .lens,html.refract .sheet{
  -webkit-backdrop-filter:url(#lg-refract) blur(var(--blur,14px)) saturate(190%) brightness(1.04);
  backdrop-filter:url(#lg-refract) blur(var(--blur,14px)) saturate(190%) brightness(1.04)}

/* ---------- Khung ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.sidebar{display:none}
.main{min-width:0;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.content{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:4px 32px}
@media (min-width:900px){
  .app{grid-template-columns:300px 1fr}
  .sidebar{display:block;padding:10px 0 10px 10px}
  .sidebar-panel{position:sticky;top:10px;height:calc(100vh - 20px);overflow:auto;border-radius:28px;padding:calc(14px + env(safe-area-inset-top,0px)) 10px 20px;--glass:var(--glass-strong);--blur:24px}
  .main{padding-bottom:24px}
  .tabbar{display:none!important}
  .content{padding-inline:32px}
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 12px 14px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--inv),var(--loan));display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.side-h{font-size:13px;font-weight:600;color:var(--label2);padding:16px 12px 6px;display:flex;align-items:center;gap:8px}
.side-h .dot{width:8px;height:8px;border-radius:50%}
.side a{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 12px;border-radius:14px;color:var(--label);font-size:15px;margin:1px 0}
.side a svg{width:22px;height:22px;color:var(--blue);flex:none}
.side a[data-domain="inv"] svg{color:var(--inv)} .side a[data-domain="loan"] svg{color:var(--loan)}
.side a:hover:not(.active){background:var(--fill)}
.side a.active{--glass:color-mix(in srgb,var(--blue) 16%,var(--glass-strong));color:var(--blue);font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.08)}

/* Thanh điều hướng: trong suốt, nội dung cuộn bên dưới mờ dần (scroll edge) */
.navbar{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);isolation:isolate}
.navbar::before{content:"";position:absolute;inset:0 0 -18px;z-index:-1;pointer-events:none;
  background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 70%,transparent),transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  -webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent)}
.navbar .in{max-width:760px;margin:0 auto;min-height:56px;display:flex;align-items:center;gap:8px;padding-inline:12px}
@media (min-width:900px){.navbar .in{padding-inline:28px}}
.back{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;color:var(--label);cursor:pointer;flex:none}
.back svg{width:22px;height:22px}
.navbar .ttl{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar .sp{width:44px;flex:none}

/* Tiêu đề lớn */
.large{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 4px 6px;flex-wrap:wrap}
.large h1{margin:0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.01em}
.domain{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;letter-spacing:0;text-transform:none}
.d-inv{color:var(--inv);background:color-mix(in srgb,var(--inv) 15%,transparent)}
.d-loan{color:var(--loan);background:color-mix(in srgb,var(--loan) 15%,transparent)}
.d-both{color:var(--label2);background:var(--fill)}

/* Lớp nội dung: danh sách inset grouped (đặc, góc bo lớn đồng tâm) */
.sec-h{font-size:13px;line-height:18px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;padding:22px 18px 7px}
.sec-f{font-size:13px;line-height:18px;color:var(--label2);padding:7px 18px 0}
.group{background:var(--cell);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:12px 18px;position:relative;width:100%;text-align:left;background:none;border:0;color:var(--label);cursor:default}
.row+.row::before{content:"";position:absolute;top:0;left:18px;right:0;border-top:.5px solid var(--sep)}
.row.ic+.row::before,.row+.row.ic::before{left:62px}
a.row,button.row{cursor:pointer}
a.row:active,button.row:active{background:var(--fill)}
.row .grow{flex:1;min-width:0}
.row .t{font-size:17px}
.row .s{font-size:15px;color:var(--label2);margin-top:2px}
.row .v{color:var(--label2);font-size:17px;text-align:right}
.row .chev{width:14px;height:14px;color:var(--label3);flex:none}
.icon-tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.icon-tile svg{width:19px;height:19px}

/* Thẻ tổng quan */
.hero{background:var(--cell);border-radius:28px;padding:20px 20px 18px;margin-top:8px}
.hero .lbl{font-size:15px;color:var(--label2)}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:4px 0 2px}
.hero .unit{font-size:20px;font-weight:600;color:var(--label2);margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:14px}
.stat .k{font-size:13px;color:var(--label2)}
.stat .n{font-size:20px;font-weight:600;margin-top:2px}

/* Nút: kính trong (thứ cấp) và kính nhuộm màu (chính) */
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{min-height:52px;padding:0 22px;border-radius:999px;border:0;font-size:17px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 160px;color:var(--label)}
.btn.fill{--glass:color-mix(in srgb,var(--blue) 86%,transparent);--spec:rgba(255,255,255,.55);color:#fff}
.btn.green{--glass:color-mix(in srgb,var(--green) 86%,transparent);--spec:rgba(255,255,255,.55);color:#fff}
.btn.tint{--glass:color-mix(in srgb,var(--blue) 14%,var(--glass));color:var(--blue)}
.btn.red{--glass:color-mix(in srgb,var(--red) 14%,var(--glass));color:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 15px;font-size:15px;flex:none}
.btn svg{width:20px;height:20px}

/* Segmented control kính, có "thấu kính" trượt */
.seg{display:flex;border-radius:999px;padding:3px;margin-top:8px;--blur:12px}
.seg button{flex:1;min-height:36px;border:0;background:none;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;color:var(--label);position:relative;z-index:1}
.seg button[aria-pressed="true"]{font-weight:600}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n,1));border-radius:999px;transform:translateX(calc(var(--i,0) * 100%));transition:transform .5s var(--spring);--glass:var(--glass-strong);z-index:0}

/* Ô nhập */
.field{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 18px}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:28px;font-weight:600;padding:6px 0}
.field .unit{color:var(--label2);font-size:17px}
.field textarea{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;line-height:22px;min-height:88px;padding:6px 0;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 14px}
.chip{min-height:34px;padding:0 14px;border-radius:999px;border:0;font-size:15px;cursor:pointer;--blur:10px}

/* Công tắc */
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--fill2);position:relative;cursor:pointer;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .4s var(--spring)}
.switch:checked{background:var(--green)} .switch:checked::after{transform:translateX(20px)}

.check{width:22px;height:22px;color:var(--blue);flex:none;visibility:hidden}
.row[aria-checked="true"] .check{visibility:visible}

.bar{height:6px;border-radius:999px;background:var(--fill);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.ring{width:96px;height:96px;flex:none}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-blue{color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent)}
.p-green{color:var(--green);background:color-mix(in srgb,var(--green) 16%,transparent)}
.p-orange{color:var(--orange);background:color-mix(in srgb,var(--orange) 16%,transparent)}
.p-red{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.p-gray{color:var(--label2);background:var(--fill)}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 18px;text-align:left;border-top:.5px solid var(--sep);white-space:nowrap}
th{font-size:13px;color:var(--label2);font-weight:500;border-top:0}
td.r,th.r{text-align:right}

.callout{display:flex;gap:12px;align-items:flex-start;background:var(--cell);border-radius:20px;padding:14px 18px;margin-top:12px;font-size:15px;line-height:20px}
.callout svg{width:22px;height:22px;flex:none;margin-top:-1px}
.callout.warn svg{color:var(--orange)} .callout.info svg{color:var(--blue)}

.grid2{display:grid;grid-template-columns:1fr;gap:0 16px}
@media (min-width:1100px){.grid2{grid-template-columns:1fr 1fr}}

/* Tab bar: viên thuốc kính nổi, thấu kính trượt theo tab đang chọn */
.tabbar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;display:flex;width:min(440px,calc(100% - 24px));border-radius:999px;padding:5px;--blur:18px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border-radius:999px;font-size:10px;font-weight:600;color:var(--label);position:relative;z-index:1}
.tabbar a svg{width:24px;height:24px}
.tabbar a.active{color:var(--blue)}
.tabbar .lens{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/var(--n,5));border-radius:999px;z-index:0;transform:translateX(calc(var(--i,0) * 100%));transition:transform .55s var(--spring);--glass:color-mix(in srgb,var(--blue) 10%,var(--glass-strong));box-shadow:0 2px 10px rgba(0,0,0,.08)}

/* Sheet: tấm kính nổi, góc bo lớn đồng tâm với màn hình */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:20;opacity:0;transition:opacity .3s}
.backdrop.on{opacity:1}
.sheet{position:fixed;z-index:21;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;border-radius:34px;--glass:var(--glass-strong);--blur:30px;box-shadow:var(--shadow);transform:translateY(110%);transition:transform .5s var(--spring);padding:8px 14px 18px}
.sheet.on{transform:none}
.sheet .group{background:color-mix(in srgb,var(--cell) 78%,transparent)}
.grabber{width:36px;height:5px;border-radius:999px;background:var(--label3);margin:4px auto 10px}
.sheet h2{font-size:20px;margin:6px 4px 4px;text-align:center}
.sheet .sub{text-align:center;color:var(--label2);font-size:15px;margin:0 8px 10px}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:540px;transform:translate(-50%,-44%) scale(.96);opacity:0;transition:opacity .25s,transform .45s var(--spring)}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .grabber{display:none}
}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:30;padding:12px 20px;border-radius:999px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center;transition:transform .55s var(--spring);max-width:calc(100% - 32px);--glass:var(--glass-strong)}
.toast.on{transform:translate(-50%,0)}
.toast svg{width:20px;height:20px;color:var(--green)}

.mock-badge{position:fixed;right:14px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:4;font-size:11px;font-weight:600;color:var(--label2);border-radius:999px;padding:5px 11px;--blur:10px}
@media (min-width:900px){.mock-badge{bottom:14px}}

/* Trợ năng: giảm độ trong suốt → kính thành mặt đặc; tăng tương phản → viền rõ hơn; giảm chuyển động → tắt hiệu ứng */
@media (prefers-reduced-transparency: reduce){
  .glass,.sidebar-panel,.tabbar,.lens,.back,.seg,.thumb,.btn,.chip,.sheet,.toast,.mock-badge,.side a.active{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  .sidebar-panel,.tabbar,.sheet,.toast,.mock-badge,.back,.seg,.chip,.btn.tint,.btn.red{--glass:var(--cell)}

function posInfo(p){
  const start = D(p.start), mat = addDays(start, p.term);
  const end = TODAY < mat ? TODAY : mat;
  const earned = p.P * p.apr * Math.max(0, diff(start, end)) / (1e4 * 365);
  const matured = TODAY >= mat;
  const floating = matured ? p.P * 0.03 * diff(mat, TODAY) / 365 : 0; // lãi thả nổi 3%
  let allowed = 0;
  if (matured) allowed = p.P * p.apr * p.term / (1e4 * 365);
  else if (p.mode === 'FLEX') allowed = earned;
  else if (p.mode === 'PER') allowed = p.P * p.apr * (Math.floor(diff(start, TODAY) / 20) * 20) / (1e4 * 365);
  const claimable = Math.max(0, allowed + floating - p.paid);
  const progress = Math.min(1, diff(start, TODAY) / p.term);
  return {start, mat, earned, floating, matured, claimable, progress, daysLeft:Math.max(0, diff(TODAY, mat)), age:diff(start, TODAY)};
}
function earlyQuote(p){ // mục 3.4, FORFEIT_AND_PENALTY, clawback bật
  const penalty = p.P * 0.02, clawback = p.paid;
  return {penalty, clawback, out:Math.max(0, p.P - penalty - clawback)};
}
function loanSchedule(P, apr, months){ // gốc đều, kỳ 30 ngày
  const rows = []; const pr = P / months; let out = P;
  for (let k = 1; k <= months; k++){ const it = out * apr / 1e4 * 30 / 365; rows.push({k, pr, it, out}); out -= pr; }
  return rows;
}

function tally(p, members){
  let a = 0, d = 0; members.forEach(m => { const v = p.votes[m]; if (v && v[0] === 'APPROVE') a++; else if (v && v[0] === 'DENY') d++; });
  return {a, d, n:members.length - a - d};
}

/* ---------- Sheet & toast ---------- */
let lastFocus = null;
function openSheet(html){
  lastFocus = document.activeElement;
  const root = document.getElementById('sheet-root');
  root.innerHTML = `<div class="backdrop" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grabber"></div>${html}</div>`;
  requestAnimationFrame(() => { root.querySelector('.backdrop').classList.add('on'); const s = root.querySelector('.sheet'); s.classList.add('on'); const f = s.querySelector('button,input'); if (f) f.focus(); });
}
function closeSheet(){
  const root = document.getElementById('sheet-root'); const s = root.querySelector('.sheet'); if (!s) return;
  s.classList.remove('on'); root.querySelector('.backdrop').classList.remove('on');
  setTimeout(() => { root.innerHTML = ''; if (lastFocus) lastFocus.focus(); }, 260);
}
let toastT;
function toast(msg){
  const t = document.getElementById('toast'); t.innerHTML = ic('check') + esc(msg); t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}
const signSheet = (title, sub, rowsHtml, act, label, extra = '') => openSheet(
  `<h2>${title}</h2><p class="sub">${sub}</p><div class="group">${rowsHtml}</div>${extra}
   <div class="btns"><button class="btn tint" data-act="closeSheet">Hủy</button><button class="btn fill" data-act="${act}">${label}</button></div>
   <p class="sub" style="margin-top:12px;font-size:13px">Ví của bạn sẽ hiện yêu cầu ký giao dịch. Phí gas trả bằng coin của chain.</p>`);

/* ---------- Liquid Glass: điểm sáng theo con trỏ, khúc xạ ---------- */
const segPrev = {};
const GLASS = '.glass,.sidebar-panel,.tabbar,.back,.seg,.btn,.chip,.sheet,.toast,.side a.active';
const mqMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : {matches:false};
const mqTransp = window.matchMedia ? window.matchMedia('(prefers-reduced-transparency: reduce)') : {matches:false};
if (navigator.userAgentData && !mqTransp.matches) document.documentElement.classList.add('refract'); // backdrop-filter: url() hiện chỉ ổn định trên Chromium
let glassRaf = 0;
document.addEventListener('pointermove', e => {
  if (mqMotion.matches || glassRaf) return;
  const g = e.target.closest && e.target.closest(GLASS); if (!g) return;
  glassRaf = requestAnimationFrame(() => {
    glassRaf = 0; const r = g.getBoundingClientRect();
    g.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
    g.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100 - 40).toFixed(1) + '%');
  });
}, {passive:true});

/* ---------- Router ---------- */
function route(){
  const path = location.hash.replace(/^#/, '') || ROLES[S.role].home;
  const parts = path.split('/').filter(Boolean);
  let html;
  if (!allowed(path)) html = viewNoAccess();
  else if (path === '/welcome') html = viewWelcome();
  else if (path === '/loan/manage') html = viewManage();
  else if (path === '/operator') html = viewOperator();
  else if (path === '/treasury') html = viewTreasury();
  else if (path === '/emergency') html = viewEmergency();
  else if (path === '/gov/new') html = viewGovNew();
  else if (path === '/ops') html = viewOps();
  else if (path === '/invest') html = viewInvest();
  else if (path === '/invest/deposit') html = viewDeposit();
  else if (path === '/invest/rewards') html = viewRewards();
  else if (parts[0] === 'invest' && parts[1] === 'p') html = viewPosition(parts[2]);
  else if (path === '/loan') html = viewLoan();
  else if (path === '/loan/request') html = viewLoanRequest();
  else if (path === '/loan/network') html = viewNetwork();
  else if (path === '/loan/fund') html = viewFund();
  else if (parts[0] === 'loan' && parts[1] === 'l') html = viewLoanDetail(parts[2]);
  else if (path === '/gov') html = viewGov();
  else if (parts[0] === 'gov' && parts.length === 3) html = viewProposal(parts[1], parts[2]);
  else if (path === '/transparency') html = viewTransparency();
  else if (path === '/account') html = viewAccount();
  else html = viewNotFound();
  renderChrome(path);
  document.getElementById('view').innerHTML = html;
  document.querySelectorAll('.seg[data-key]').forEach(el => { // trượt thấu kính từ vị trí cũ sang vị trí mới
    const k = el.dataset.key, to = el.style.getPropertyValue('--i'), from = segPrev[k];
    if (from != null && from !== to){ el.style.setProperty('--i', from); requestAnimationFrame(() => requestAnimationFrame(() => el.style.setProperty('--i', to))); }
    segPrev[k] = to;
  });
  const navPath = '/' + parts.slice(0, 2).join('/');
  document.title = 'NEXUS · ' + (document.querySelector('.large h1') || {}).textContent;
  return navPath;
}
function rerender(keepScroll = true){ const y = window.scrollY; route(); if (keepScroll) window.scrollTo(0, y); }

        row({t:'Nhận về', v:`<b style="color:var(--label)">${fmt(q.out, 2)} USDT</b>`})].join(''),
        'confirmEarly', 'Rút trước hạn',
        `<div class="callout warn">${ic('warn')}<div>Toàn bộ điểm KPI của khoản này bị trừ lại, ở cả bạn và tuyến trên. Nếu điểm xuống dưới ngưỡng, hạng sẽ tự hạ.</div></div><input type="hidden" id="earlyId" value="${p.id}">`);
      break; }
    case 'confirmEarly': case 'withdraw': {
      const pid = a === 'withdraw' ? id : document.getElementById('earlyId').value;
      S.positions = S.positions.filter(x => x.id !== pid); closeSheet(); toast('Đã rút ' + pid); location.hash = '#/invest'; break; }
    case 'advance': {
      const cur = RANK_TERMS[S.rank.r], prog = Math.min(1, S.rank.cyclePts / cur.req), adv = Math.max(0, Math.min(cur.rw * 0.5 * prog, S.rank.credit) - S.rank.debt);
      signSheet('Ứng trước thưởng', 'Investment', [row({t:'Số tiền ứng', v:fmt(adv, 2) + ' USDT'}), row({t:'Trả nợ', s:'Tự trừ vào thưởng chu kỳ sau; nếu rút gốc, nợ được trừ vào tiền rút'}), row({t:'Quá hạn', s:'Khoảng ngày 90 chưa trả: khóa ứng thêm và lên hạng. Ngày 210: nợ xấu'})].join(''), 'confirmAdvance', 'Ký và nhận');
      break; }
    case 'confirmAdvance': { const cur = RANK_TERMS[S.rank.r], prog = Math.min(1, S.rank.cyclePts / cur.req); const adv = Math.max(0, Math.min(cur.rw * 0.5 * prog, S.rank.credit) - S.rank.debt); S.rank.debt += adv; closeSheet(); toast('Đã ứng ' + fmt(adv, 2) + ' USDT'); rerender(); break; }
    case 'copy': {
      const link = 'https://nexus.app/?ref=' + S.codes[0];
      if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => toast('Đã sao chép liên kết'), () => toast(link)); else toast(link); break; }
    case 'buyCode':
      openSheet(`<h2>Mua mã giới thiệu</h2><p class="sub">Mua qua 2 bước để không bị người khác giành trước: gửi mã đã mã hóa, rồi xác nhận sau ít nhất 1 block.</p>
        <div class="group"><label class="field"><input aria-label="Mã muốn mua" placeholder="vd: an_nguyen" style="font-size:20px"></label></div>
        <div class="sec-f">Chữ thường, số và dấu gạch dưới, 3–20 ký tự. Mã thuộc về tài khoản, tự đi theo khi đổi ví.</div>
        <div class="btns"><button class="btn tint" data-act="closeSheet">Hủy</button><button class="btn fill" data-act="buyDone">Gửi bước 1</button></div>`); break;
    case 'buyDone': closeSheet(); toast('Đã gửi bước 1, xác nhận sau 1 block'); break;
    case 'repay': {
      const L = S.loan, r = loanSchedule(L.P, L.apr, L.months)[L.paidK];
      signSheet('Trả kỳ ' + (L.paidK + 1), L.id + ' · Loan', [row({t:'Gốc', v:fmt(r.pr, 2)}), row({t:'Lãi', v:fmt(r.it, 2)}), row({t:'Tổng', v:`<b style="color:var(--label)">${fmt(r.pr + r.it, 2)} USDT</b>`})].join(''), 'confirmRepay', 'Ký và trả'); break; }
    case 'confirmRepay': S.loan.paidK = Math.min(S.loan.months, S.loan.paidK + 1); closeSheet(); toast('Đã trả kỳ ' + S.loan.paidK); rerender(); break;
    case 'pkg': S.req.pkg = +el.dataset.v; rerender(); break;
    case 'reviewLoan': {
      const pk = S.pkgs[S.req.pkg], fee = S.offer.pkg === S.req.pkg ? S.offer.fee : pk.fee;
      signSheet('Gửi yêu cầu vay', 'Loan', [row({t:'Gói', v:pk.n}), row({t:'Số tiền', v:fmt(S.req.amount) + ' USDT'}), row({t:'Nhận về', v:fmt(S.req.amount * (1 - fee / 1e4), 2) + ' USDT'}),
        row({icon:tile('person', 'var(--loan)'), t:'1. Bạn gửi yêu cầu', s:'Ngay bây giờ'}), row({icon:tile('network', 'var(--orange)'), t:'2. Người giới thiệu xác nhận', s:'Trong 7 ngày'}), row({icon:tile('bank', 'var(--green)'), t:'3. Quản lý duyệt và giải ngân', s:'Hạn mức nhánh được trừ lúc này'})].join(''), 'confirmLoan', 'Ký và gửi'); break; }
    case 'confirmLoan': closeSheet(); toast('Đã gửi yêu cầu vay'); location.hash = '#/loan'; break;
    case 'refApprove': case 'refDeny': { const x = S.approvals.find(v => v.id === id); x.st = a === 'refApprove' ? 'REFERRER_APPROVED' : 'REJECTED'; toast(a === 'refApprove' ? 'Đã xác nhận ' + id : 'Đã từ chối ' + id); rerender(); break; }
    case 'fundReq': { const x = S.fund.pos.find(v => v.id === id); x.req = '2026-10-14'; toast('Đã yêu cầu rút, nhận từ ' + fdate(addDays(TODAY, 30))); rerender(); break; }
    case 'fundAdd': signSheet('Góp thêm vốn', 'Gói nhà đầu tư · Loan', [row({t:'Quota còn lại', v:fmt(S.fund.quota - S.fund.pos.reduce((s, p) => s + p.amount, 0)) + ' USDT'}), row({t:'Lãi', v:'12%/năm, trả hằng tháng'}), row({t:'Khóa', s:'90 ngày từ lúc góp; rút cần báo trước 30 ngày'})].join(''), 'closeSheet', 'Ký và góp'); break;
    case 'fundClaim': toast('Đã nhận ' + fmt(30000 * 0.12 * 30 / 365, 2) + ' USDT lãi tháng'); break;
    case 'govTab': S.govTab = el.dataset.v; rerender(); break;
    case 'vote': {
      const g = S.gov[el.dataset.k], p = g.props.find(x => x.id === +el.dataset.id), v = el.dataset.v;
      p.votes[S.me.memberOf[el.dataset.k]] = [v, ''];
      const t = tally(p, g.members), need = TIER[p.tier].need;
      if (p.status === 'PENDING' && t.a >= need){ p.status = 'QUEUED'; p.eta = addDays(TODAY, TIER[p.tier].delay).toISOString().slice(0, 10); }
      else if (p.status === 'QUEUED' && t.a < need) p.status = 'CANCELLED';
      else if (p.status === 'PENDING' && t.d > g.members.length - need) p.status = 'REJECTED';
      toast(v === 'APPROVE' ? 'Đã đồng ý' : 'Đã từ chối'); rerender(); break; }
    case 'exec': { const g = S.gov[el.dataset.k], p = g.props.find(x => x.id === +el.dataset.id); p.status = 'EXECUTED'; toast('Đã thực thi #' + p.id); rerender(); break; }
    case 'migrate': openSheet(`<h2>Chuyển sang ví mới</h2><p class="sub">Ví mới phải chưa từng dùng trong NEXUS.</p><div class="group">${row({t:'1. Ví cũ đề xuất ví mới'})}${row({t:'2. Ví mới xác nhận'})}${row({t:'3. Sau 48 giờ, ai cũng thực thi được', s:'Trong 48 giờ, ví cũ hoặc hội đồng có thể hủy'})}</div><div class="btns"><button class="btn tint" data-act="closeSheet">Đóng</button></div>`); break;
    case 'lost': openSheet(`<h2>Báo mất ví</h2><p class="sub">Chỉ áp dụng cho tài khoản đã xác minh danh tính.</p><div class="group">${row({t:'1. Ví mới gửi yêu cầu khôi phục'})}${row({t:'2. Xác minh danh tính với nhóm vận hành', s:'Ví cũ bị khóa tạm thời ngay'})}${row({t:'3. Hội đồng thực thi sau 48 giờ', s:'Ví cũ phản đối thì chuyển sang xem xét lại'})}</div><div class="btns"><button class="btn tint" data-act="closeSheet">Đóng</button></div>`); break;
  }
});

route();
})();
</script>

</body></html>
