          <div style="font-size:13.5px;color:var(--text-muted);">${q.wordObj.vi}</div>
          ${audioBar}
          <div class="quiz-options-4">
            ${q.options.map((opt, idx) => {
              let cls = "";
              if (state.answered) {
                if (opt.correct) cls = "correct";
                else if (idx === state.pickedIdx) cls = "wrong";
              }
              return `
                <button type="button" class="opt-btn ${cls}" ${state.answered ? "disabled" : ""} onclick="answerQuiz(${idx})">
                  <span class="ipa" style="font-size:18px;font-weight:800;">${opt.ipa}</span>
                </button>
              `;
            }).join("")}
          </div>
        `;
        if (state.answered) {
          const isOk = q.options[state.pickedIdx].correct;
          html += `
            <div class="quiz-feedback ${isOk ? "fb-ok" : "fb-err"}">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
                <strong>${isOk ? "✅ Chính xác!" : "❌ Chưa đúng!"} ${q.wordObj.word} = <span class="ipa">${q.wordObj.ipa}</span></strong>
                <button type="button" class="${isOk ? "btn-success" : "btn-primary"}" onclick="nextQuizQuestion(true)">Câu tiếp theo →</button>
              </div>
            </div>
          `;
        }
      } else {
        // MODE 4: SPEAKING QUIZ
        const envNote = !speaker.hasSR() ? `
          <div class="env-notice" style="margin-bottom:12px;">
            ℹ️ <strong>Thông báo Micro:</strong> Trình duyệt hoặc khung xem trước hiện chưa hỗ trợ nhận diện giọng nói tự động. Bạn vẫn có thể nghe mẫu và dùng nút <strong>Ghi âm so sánh</strong> bên dưới (nếu trình duyệt cho phép Micro).
          </div>
        ` : "";

        html = `
          <span class="quiz-tag ipa">${q.tag}</span>
          <div class="quiz-big-word">${q.targetWord}</div>
          <div class="ipa" style="font-size:20px;font-weight:800;color:var(--c-mono-tx);">${q.targetIpa}</div>
          <div style="font-size:13.5px;color:var(--text-muted);margin-bottom:10px;">${q.targetVi}</div>
          ${q.pairInfo ? `<div class="pair-hint-pill">⚡ Dễ nhầm với: <strong>${q.pairInfo.other.word}</strong> <span class="ipa">${q.pairInfo.other.ipa}</span></div>` : ""}
          ${audioBar}
          ${envNote}

          <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
            ${speaker.hasSR() ? `
              <button type="button" class="btn-mic-hero ${speaker.isListening ? "listening" : ""}" onclick="toggleQuizSpeakingMic()">
                ${speaker.isListening ? "🎙️ Đang nghe... (Chạm để dừng)" : `🎤 Bấm để đọc "${q.targetWord}"`}
              </button>
              <div id="spkInterimText" style="min-height:20px;font-size:13px;font-weight:700;color:var(--c-diph-tx);">${state.speakingInterim}</div>
            ` : ""}

            ${state.speakingError ? `<div class="env-notice" style="width:100%;">⚠️ ${state.speakingError}</div>` : ""}
            ${buildSpeakingDiagnosisHTML(q.targetWord, q.targetIpa, q.pairInfo, state.speakingResult)}

            <div class="shadowing-box" style="width:100%;">
              <div style="font-size:12px;font-weight:800;color:var(--text-sub);">🎙️ Ghi âm &amp; Nghe lại so sánh (Shadowing)</div>
              <div class="shadowing-btns">
                <button type="button" class="btn-outline ${speaker.isRecording ? "btn-rec-active" : ""}" onclick="toggleShadowRec('quiz')">
                  ${speaker.isRecording ? "⏹ Đang ghi... (Dừng)" : "⏺ Ghi âm (3.5s)"}
                </button>
                <button type="button" class="btn-success" ${speaker.lastRecordingUrl ? "" : "disabled style=\"opacity:0.45;\""} onclick="playShadowCompare('${escJs(q.targetWord)}')">
                  ▶ So sánh Mẫu → Bạn
                </button>
              </div>
            </div>

            <div style="margin-top:4px;">
              <button type="button" class="btn-outline" onclick="nextQuizQuestion(false)">Từ tiếp theo →</button>
            </div>
          </div>
        `;
      }

      mount.innerHTML = html;
    }

    function toggleQuizSpeakingMic() {
      const q = state.currentQ;
      if (!q || q.mode !== "speaking") return;
      if (speaker.isListening) {
        speaker.stopListening();
        renderQuizStage();
        return;
      }
      state.speakingError = "";
      state.speakingInterim = "Đang nghe bạn đọc...";
      const ok = speaker.startListening({
        lang: speech.accent,
        targetWord: q.targetWord,
        pairWord: q.pairInfo ? q.pairInfo.other.word : null,
        onInterim: (txt) => {
          state.speakingInterim = txt;
          const el = document.getElementById("spkInterimText");
          if (el) el.textContent = `Đang nghe: "${txt}"...`;
        },
        onResult: (verdict) => {
          state.speakingResult = verdict;
          state.speakingInterim = "";
          const isOk = verdict.status === "correct";
          speech.playSFX(isOk ? "correct" : "wrong");
          if (!state.answered) {
            state.answered = true;
            recordStat(q.statKey, q.statLabel, isOk);
          }
          renderQuizStage();
        },
        onError: (msg) => {
          state.speakingError = msg;
          state.speakingInterim = "";
          renderQuizStage();
        },
        onEnd: () => renderQuizStage()
      });
      if (ok) renderQuizStage();
    }

    function toggleShadowRec(scope) {
      if (speaker.isRecording) {
        speaker.stopRecording();
        return;
      }
      speaker.startRecording({
        maxMs: 3500,
        onStart: () => {
          showToast("Đang ghi âm (tối đa 3.5 giây)...");
          if (scope === "quiz") renderQuizStage();
          else renderQuickMicModal();
        },
        onStop: () => {
          showToast("Đã lưu bản ghi! Bấm \"So sánh Mẫu → Bạn\" để nghe lại.");
          if (scope === "quiz") renderQuizStage();
          else renderQuickMicModal();
        },
        onError: (msg) => {
          showToast(msg);
          if (scope === "quiz") renderQuizStage();
          else renderQuickMicModal();
        }
      });
    }

    function playShadowCompare(word) {
      if (!speaker.lastRecordingUrl) {
        showToast("Hãy bấm Ghi âm trước nhé!");
        return;
      }
      speaker.playComparison(word, (step) => {
        if (step === "model") showToast(`🔊 Giọng mẫu: ${word}`);
        else if (step === "user") showToast("🎙️ Giọng của bạn...");
      });
    }

    /* =========================================================================
     * 12. QUICK MIC MODAL (DÙNG CHUNG CHO TAB 1, TAB 2, TAB 4)
     * ========================================================================= */
    function openQuickMic(word, ipa, vi, pairId = null, side = null) {
      speech.stopAll();
      speaker.stopListening();
      speaker.stopRecording();

      let pairInfo = null;
      if (pairId && side) {
        const p = MINIMAL_PAIRS.find(x => x.id === pairId);
        if (p) {
          const row = p.pairs.find(r => (side === "a" ? r.a.word : r.b.word).toLowerCase() === word.toLowerCase());
          if (row) pairInfo = { pair: p, side, self: side === "a" ? row.a : row.b, other: side === "a" ? row.b : row.a };
        }
      } else {
        pairInfo = WORD_PAIR_MAP.get(word.toLowerCase()) || null;
      }

      state.quickMic = { word, ipa, vi, pairInfo, result: null, interim: "", error: "" };
      renderQuickMicModal();
      document.getElementById("micModalBackdrop").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeQuickMic() {
      speaker.stopListening();
      speaker.stopRecording();
      state.quickMic = null;
      document.getElementById("micModalBackdrop").classList.remove("open");
      if (!document.getElementById("mobileSheetBackdrop").classList.contains("open")) {
        document.body.style.overflow = "";
      }
    }

    function toggleQuickMicListen() {
      const qm = state.quickMic;
      if (!qm) return;
      if (speaker.isListening) {
        speaker.stopListening();
        renderQuickMicModal();
        return;
      }
      qm.error = "";
      qm.interim = "Đang nghe bạn đọc...";
      const ok = speaker.startListening({
        lang: speech.accent,
        targetWord: qm.word,
        pairWord: qm.pairInfo ? qm.pairInfo.other.word : null,
        onInterim: (txt) => {
          qm.interim = txt;
          const el = document.getElementById("qmInterim");
          if (el) el.textContent = `Đang nghe: "${txt}"...`;
        },
        onResult: (verdict) => {
          qm.result = verdict;
          qm.interim = "";
          speech.playSFX(verdict.status === "correct" ? "correct" : "wrong");
          renderQuickMicModal();
        },
        onError: (msg) => {
          qm.error = msg;
          qm.interim = "";
          renderQuickMicModal();
        },
        onEnd: () => renderQuickMicModal()
      });
      if (ok) renderQuickMicModal();
    }

    function renderQuickMicModal() {
      const qm = state.quickMic;
      if (!qm) return;
      const mount = document.getElementById("micModalBody");
      const envNote = !speaker.hasSR() ? `
        <div class="env-notice" style="margin-bottom:12px;">
          ℹ️ <strong>Lưu ý:</strong> Trình duyệt hoặc khung xem trước hiện chưa hỗ trợ nhận diện giọng nói tự động. Bạn có thể nghe mẫu và thử <strong>Ghi âm so sánh</strong> bên dưới.
        </div>
      ` : "";

      mount.innerHTML = `
        <div style="text-align:center;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
            <span class="quiz-tag" style="margin:0;">🎤 Kiểm tra phát âm nhanh</span>
            <button type="button" class="sheet-close-btn" onclick="closeQuickMic()" aria-label="Đóng">✕</button>
          </div>
          <div class="quiz-big-word">${qm.word}</div>
          <div class="ipa" style="font-size:19px;font-weight:800;color:var(--c-mono-tx);">${qm.ipa}</div>
          <div style="font-size:13.5px;color:var(--text-muted);margin-bottom:10px;">${qm.vi}</div>
          ${qm.pairInfo ? `<div class="pair-hint-pill">⚡ Dễ nhầm với: <strong>${qm.pairInfo.other.word}</strong> <span class="ipa">${qm.pairInfo.other.ipa}</span></div>` : ""}

          <div class="quiz-audio-row" style="margin:10px 0 14px;">
            <button type="button" class="btn-primary" onclick="speech.speak('${escJs(qm.word)}')">🔊 Nghe mẫu</button>
            <button type="button" class="btn-outline" onclick="speech.speak('${escJs(qm.word)}', 0.65)">🐢 0.65x</button>
          </div>

          ${envNote}

          ${speaker.hasSR() ? `
            <div style="margin-bottom:10px;">
              <button type="button" class="btn-mic-hero ${speaker.isListening ? "listening" : ""}" onclick="toggleQuickMicListen()">
                ${speaker.isListening ? "🎙️ Đang nghe... (Dừng)" : "🎤 Bấm để đọc & chấm điểm"}
              </button>
              <div id="qmInterim" style="min-height:20px;margin-top:6px;font-size:13px;font-weight:700;color:var(--c-diph-tx);">${qm.interim}</div>
            </div>
          ` : ""}

          ${qm.error ? `<div class="env-notice" style="margin-bottom:10px;">⚠️ ${qm.error}</div>` : ""}
          ${buildSpeakingDiagnosisHTML(qm.word, qm.ipa, qm.pairInfo, qm.result)}

          <div class="shadowing-box">
            <div style="font-size:12px;font-weight:800;color:var(--text-sub);">🎙️ Ghi âm &amp; Nghe lại so sánh (Shadowing)</div>
            <div class="shadowing-btns">
              <button type="button" class="btn-outline ${speaker.isRecording ? "btn-rec-active" : ""}" onclick="toggleShadowRec('modal')">
                ${speaker.isRecording ? "⏹ Đang ghi... (Dừng)" : "⏺ Ghi âm (3.5s)"}
              </button>
              <button type="button" class="btn-success" ${speaker.lastRecordingUrl ? "" : "disabled style=\"opacity:0.45;\""} onclick="playShadowCompare('${escJs(qm.word)}')">
                ▶ So sánh Mẫu → Bạn
              </button>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================================
     * 13. TAB 4: KHO TỪ & TRA CỨU NHANH (450+ TỪ)
     * ========================================================================= */
    function setVocabQuery(q) {
      state.vocabQuery = (q || "").trim().toLowerCase();
      renderVocabGrid();
    }

    function setVocabFilter(f) {
      state.vocabFilter = f;
      ["all", "monophthong", "diphthong", "voiceless", "voiced"].forEach(k => {
        document.getElementById(`vFilt-${k}`).classList.toggle("active", k === f);
      });
      renderVocabGrid();
    }

    function speakVocabItem(word, idx, customRate) {
      document.querySelectorAll(".vocab-card.speaking").forEach(el => el.classList.remove("speaking"));
      const card = document.getElementById(`vCard-${idx}`);
      if (card) card.classList.add("speaking");
      speech.speak(word, customRate, () => { if (card) card.classList.remove("speaking"); });
    }

    function renderVocabGrid() {
      const q = state.vocabQuery;
      const list = MASTER_VOCAB.filter(w => {
        if (state.vocabFilter !== "all" && w.group !== state.vocabFilter) return false;
        if (!q) return true;
        return w.word.toLowerCase().includes(q)
          || w.vi.toLowerCase().includes(q)
          || w.ipa.toLowerCase().includes(q)
          || w.symbol.toLowerCase().includes(q);
      });

      document.getElementById("vocabCountText").textContent = `Hiển thị ${list.length} / ${MASTER_VOCAB.length} từ chuẩn IPA`;
      const mount = document.getElementById("vocabGridMount");
      if (!list.length) {
        mount.innerHTML = `<div class="card status-box" style="grid-column:1/-1;">Không tìm thấy từ nào khớp với "${q}".</div>`;
        return;
      }

      const gMap = Object.fromEntries(IPA_GROUPS.map(g => [g.id, g]));
      mount.innerHTML = list.map((w, idx) => {
        const g = gMap[w.group] || IPA_GROUPS[0];
        return `
          <div id="vCard-${idx}" class="card vocab-card">
            <button type="button" class="vocab-main-btn" onclick="speakVocabItem('${escJs(w.word)}', ${idx}, null)">
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                <span style="font-size:15.5px;font-weight:800;">${w.word}</span>
                <span class="ipa" style="font-size:13px;font-weight:700;color:${g.badgeTx};background:${g.badgeBg};padding:1px 7px;border-radius:999px;">${w.ipa}</span>
              </div>
              <div style="font-size:12.5px;color:var(--text-muted);margin-top:2px;">${w.vi}</div>
            </button>
            <button type="button" class="btn-mini slow" onclick="speakVocabItem('${escJs(w.word)}', ${idx}, 0.65)" title="Nghe chậm 0.65x">🐢</button>
            <button type="button" class="btn-mini mic" onclick="openQuickMic('${escJs(w.word)}', '${escJs(w.ipa)}', '${escJs(w.vi)}')" title="Kiểm tra phát âm">🎤</button>
          </div>
        `;
      }).join("");
    }

    /* =========================================================================
     * 14. SAFE BOOTSTRAP (KHÔNG BAO GIỜ TRẮNG MÀN HÌNH)
     * ========================================================================= */
    function bootApp() {
      try {
        document.getElementById("headerWordBadge").textContent = `${MASTER_VOCAB.length} từ`;
        speech.onStatusChange = (txt) => {
          const el = document.getElementById("voiceStatus");
          if (el) el.textContent = `Nguồn đọc: ${txt}`;
        };
        speech._notify();

        renderIPAChart();
        renderIPADetail();
        renderPairSelector();
        renderPairDetail();
        renderQuizFilterOptions();
        renderQuizStats();
        renderVocabGrid();

        const bootEl = document.getElementById("bootFallback");
        if (bootEl) bootEl.classList.add("hidden");

        document.getElementById("panel-chart").classList.remove("hidden");
      } catch (err) {
        const bootEl = document.getElementById("bootFallback");
        if (bootEl) {
          bootEl.classList.remove("hidden");
          bootEl.innerHTML = `
            <div class="error-fallback">
              <strong>Đã xảy ra lỗi khởi tạo giao diện:</strong><br/>
              ${err && err.message ? err.message : String(err)}
            </div>
          `;
        }
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", bootApp);
    } else {
      bootApp();
    }
  </script>
</body>
</html>
