<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>IPA Master — Học &amp; Phân Biệt 44 Âm Tiếng Anh</title>
  <style>
    /* =========================================================================
     * 1. DESIGN TOKENS & RESET (100% PURE INLINE CSS — ZERO EXTERNAL CDN)
     * ========================================================================= */
    :root {
      --bg-page: #f1f5f9;
      --bg-card: #ffffff;
      --bg-soft: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-main: #0f172a;
      --text-sub: #334155;
      --text-muted: #64748b;
      --radius-lg: 18px;
      --radius-md: 13px;
      --radius-sm: 10px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.09);

      /* 4 IPA Category Palettes */
      --c-mono: #0284c7;
      --c-mono-bg: #e0f2fe;
      --c-mono-bd: #7dd3fc;
      --c-mono-tx: #0369a1;

      --c-diph: #7c3aed;
      --c-diph-bg: #ede9fe;
      --c-diph-bd: #c4b5fd;
      --c-diph-tx: #6d28d9;

      --c-vless: #d97706;
      --c-vless-bg: #fef3c7;
      --c-vless-bd: #fcd34d;
      --c-vless-tx: #b45309;

      --c-voiced: #059669;
      --c-voiced-bg: #d1fae5;
      --c-voiced-bd: #6ee7b7;
      --c-voiced-tx: #047857;

      /* Feedback Colors */
      --c-ok: #16a34a;
      --c-ok-bg: #dcfce7;
      --c-ok-bd: #86efac;
      --c-err: #dc2626;
      --c-err-bg: #fee2e2;
      --c-err-bd: #fca5a5;
      --c-warn: #d97706;
      --c-warn-bg: #fef3c7;
      --c-warn-bd: #fcd34d;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-ipa: "Lucida Sans Unicode", "Segoe UI", "DejaVu Sans", Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button, input, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      touch-action: manipulation;
    }

    .ipa {
      font-family: var(--font-ipa);
      letter-spacing: 0.01em;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================================
     * 2. HEADER & AUDIO CONTROL BAR
     * ========================================================================= */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .header-inner {
      max-width: 1220px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg, #0284c7, #7c3aed);
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
    }

    .brand-text h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--c-mono-tx);
      background: var(--c-mono-bg);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .brand-text p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .audio-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .seg-group {
      display: inline-flex;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px;
    }

    .seg-btn {
      min-height: 40px;
      min-width: 48px;
      padding: 0 10px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-sub);
      transition: background 0.15s, color 0.15s;
    }

    .seg-btn.active {
      background: #0f172a;
      color: #fff;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.2);
    }

    .source-select {
      min-height: 44px;
      padding: 0 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-main);
      outline: none;
    }

    .ctrl-btn {
      min-height: 44px;
      min-width: 44px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-sub);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: transform 0.1s, background 0.15s;
    }

    .ctrl-btn:active, .seg-btn:active {
      transform: scale(0.96);
    }

    .ctrl-btn.primary-soft {
      background: var(--c-mono-bg);
      border-color: var(--c-mono-bd);
      color: var(--c-mono-tx);
    }

    .ctrl-btn.sfx-on {
      background: var(--c-voiced-bg);
      border-color: var(--c-voiced-bd);
      color: var(--c-voiced-tx);
    }

    /* Top Tabs (Tablet/Desktop) */
    .top-nav {
      display: none;
      gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    .top-tab-btn {
      min-height: 44px;
      padding: 0 16px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-sub);
      background: transparent;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: background 0.15s, color 0.15s;
    }

    .top-tab-btn:hover {
      background: var(--bg-soft);
    }

    .top-tab-btn.active {
      background: #0f172a;
      color: #fff;
    }

    /* =========================================================================
     * 3. MAIN CONTAINER & COMMON CARDS / BUTTONS
     * ========================================================================= */
    .app-main {
      max-width: 1220px;
      margin: 0 auto;
      padding: 14px 12px calc(86px + env(safe-area-inset-bottom, 0px));
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }

    .btn-primary {
      min-height: 44px;
      padding: 0 16px;
      border-radius: 12px;
      background: #0284c7;
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, background 0.15s;
    }

    .btn-primary:active { transform: scale(0.97); background: #0369a1; }

    .btn-success {
      min-height: 44px;
      padding: 0 16px;
      border-radius: 12px;
      background: #059669;
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-success:active { transform: scale(0.97); }

    .btn-outline {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--border-strong);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-outline:active { transform: scale(0.97); background: var(--bg-soft); }

    .btn-mini {
      min-width: 44px;
      min-height: 44px;
      padding: 0 10px;
      border-radius: 11px;
      background: #fff;
      border: 1px solid var(--border);
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.1s, background 0.15s;
    }

    .btn-mini:active { transform: scale(0.94); background: var(--bg-soft); }
    .btn-mini.mic { border-color: var(--c-diph-bd); color: var(--c-diph-tx); }
    .btn-mini.slow { border-color: var(--c-warn-bd); color: var(--c-warn); }

    .status-box {
      padding: 20px;
      text-align: center;
      font-size: 14px;
      color: var(--text-sub);
    }

    .error-fallback {
      background: var(--c-err-bg);
      border: 1px solid var(--c-err-bd);
      color: #991b1b;
      padding: 16px;
      border-radius: 14px;
      text-align: left;
      font-size: 13.5px;
    }

    /* =========================================================================
     * 4. TAB 1: 44 IPA SOUNDS CHART & DETAIL PANEL
     * ========================================================================= */
    .chart-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
    }

    .chart-groups {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .group-card {
      padding: 14px;
    }

    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }

    .group-title {
      font-size: 14px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .group-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .group-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .ipa-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .ipa-tile {
      min-height: 62px;
      padding: 8px 4px;
      border-radius: 13px;
      border: 1.5px solid var(--border);
      background: var(--bg-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: transform 0.1s, box-shadow 0.15s, border-color 0.15s;
    }

    .ipa-tile:active { transform: scale(0.95); }

    .ipa-tile .sym {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.15;
    }

    .ipa-tile .ex {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tile-mono { background: var(--c-mono-bg); border-color: var(--c-mono-bd); color: var(--c-mono-tx); }
    .tile-diph { background: var(--c-diph-bg); border-color: var(--c-diph-bd); color: var(--c-diph-tx); }
    .tile-vless { background: var(--c-vless-bg); border-color: var(--c-vless-bd); color: var(--c-vless-tx); }
    .tile-voiced { background: var(--c-voiced-bg); border-color: var(--c-voiced-bd); color: var(--c-voiced-tx); }

    .ipa-tile.selected {
      box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.2);
      border-color: #0f172a;
      transform: translateY(-1px);
    }

    /* Desktop/Tablet Sticky Detail Panel */
    .detail-desktop-wrap {
      display: none;
    }

    .detail-card {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .detail-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .detail-sym-box {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .detail-meta {
      flex: 1;
      min-width: 0;
    }

    .detail-meta h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
    }

    .detail-meta p {
      margin: 3px 0 0;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .guide-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .guide-item {
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      font-size: 13px;
    }

    .guide-item strong {
      display: block;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .spell-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .spell-tag {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .ex-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .ex-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      transition: border-color 0.15s, background 0.15s;
    }

    .ex-row.speaking {
      background: var(--c-mono-bg);
      border-color: var(--c-mono);
    }

    .ex-main-btn {
      flex: 1;
      min-height: 44px;
      text-align: left;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .ex-word {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
    }

    .ex-ipa {
      font-size: 13px;
      font-weight: 700;
      color: var(--c-mono-tx);
      margin-left: 5px;
    }

    .ex-vi {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    /* =========================================================================
     * 5. TAB 2: 15 MINIMAL PAIRS WORKSHOP
     * ========================================================================= */
    .pairs-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }

    .pair-nav-card {
      padding: 12px;
    }

    .pill-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .pill-btn {
      min-height: 40px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .pill-btn.active {
      background: #0f172a;
      border-color: #0f172a;
      color: #fff;
    }

    .pair-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .pair-list::-webkit-scrollbar { display: none; }

    .pair-item-btn {
      min-height: 44px;
      padding: 8px 13px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      font-size: 13.5px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pair-item-btn.active {
      background: var(--c-mono-bg);
      border-color: var(--c-mono);
      color: var(--c-mono-tx);
    }

    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .compare-box {
      padding: 12px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--bg-soft);
    }

    .compare-box.side-a {
      background: var(--c-mono-bg);
      border-color: var(--c-mono-bd);
    }

    .compare-box.side-b {
      background: var(--c-diph-bg);
      border-color: var(--c-diph-bd);
    }

    .compare-sym {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .mp-rows {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .mp-row {
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      align-items: center;
    }

    .mp-word-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mp-word-btn {
      flex: 1;
      min-height: 52px;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--bg-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      gap: 8px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .mp-word-btn:active { transform: scale(0.98); }
    .mp-word-btn.speaking-a { background: var(--c-mono-bg); border-color: var(--c-mono); }
    .mp-word-btn.speaking-b { background: var(--c-diph-bg); border-color: var(--c-diph); }

    .mp-vs-btn {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      background: #0f172a;
      color: #fff;
      font-size: 12.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }

    .mp-vs-btn:active { transform: scale(0.97); }

    /* =========================================================================
     * 6. TAB 3: QUIZ & SPEAKING PRACTICE (4 MODES)
     * ========================================================================= */
    .quiz-controls {
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-modes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      background: var(--bg-soft);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .quiz-mode-btn {
      min-height: 48px;
      padding: 6px 8px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-sub);
      line-height: 1.25;
      transition: background 0.15s, color 0.15s;
    }

    .quiz-mode-btn.active {
      background: #0f172a;
      color: #fff;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.18);
    }

    .quiz-subbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .quiz-stats-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
    }

    .stat-pill {
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
    }

    .quiz-stage {
      padding: 20px 16px;
      text-align: center;
      max-width: 720px;
      margin: 0 auto;
    }

    .quiz-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--c-mono-bg);
      color: var(--c-mono-tx);
      font-size: 12.5px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .quiz-big-word {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 4px 0;
    }

    .quiz-audio-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 18px;
    }

    .quiz-options-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .quiz-options-4 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .opt-btn {
      min-height: 76px;
      padding: 12px 10px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--bg-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: transform 0.1s, border-color 0.15s, background 0.15s;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--c-mono);
      background: #fff;
    }

  <script>
    /* =========================================================================
     * 1. SAFE STORAGE HELPER (CHỐNG LỖI SECURITYERROR TRONG SANDBOXED IFRAME)
     * ========================================================================= */
    const SafeStorage = (() => {
      const mem = Object.create(null);
      let ok = false;
      try {
        const k = "__ipa_probe__";
        window.localStorage.setItem(k, "1");
        window.localStorage.removeItem(k);
        ok = true;
      } catch (e) {
        ok = false;
      }
      return {
        get(key, fallback = null) {
          try {
            if (ok) {
              const v = window.localStorage.getItem(key);
              return v !== null ? v : fallback;
            }
          } catch (e) {}
          return Object.prototype.hasOwnProperty.call(mem, key) ? mem[key] : fallback;
        },
        set(key, val) {
          mem[key] = String(val);
          try {
            if (ok) window.localStorage.setItem(key, String(val));
          } catch (e) {}
        }
      };
    })();

    /* =========================================================================
     * 2. SPEECH ENGINE 3 TẦNG (ONLINE YOUDAO -> DICTIONARYAPI -> OFFLINE TTS)
     *    Khởi tạo hoàn toàn an toàn (lazy), chống treo trên Xiaomi Pad / Android
     * ========================================================================= */
    class SpeechEngine {
      constructor() {
        this.accent = "en-US";
        this.rate = 1.0;
        this.mode = "auto"; // "auto" | "tts"
        this.sfxEnabled = true;
        this.audioCtx = null;
        this.sharedAudio = null;
        this.audioUnlocked = false;
        this.dictCache = new Map();
        this.voices = [];
        this.seqToken = 0;
        this.activeTimers = [];
        this.onStatusChange = null;
        this._bindUnlock();
      }

      _getAudio() {
        if (!this.sharedAudio) {
          try {
            this.sharedAudio = new Audio();
            this.sharedAudio.preload = "auto";
          } catch (e) {
            return null;
          }
        }
        return this.sharedAudio;
      }

      _hasTTS() {
        try {
          return typeof window !== "undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
        } catch (e) {
          return false;
        }
      }

      _loadVoices() {
        if (!this._hasTTS()) return [];
        try {
          const list = window.speechSynthesis.getVoices();
          if (list && list.length) this.voices = list;
        } catch (e) {}
        return this.voices;
      }

      _bindUnlock() {
        const unlock = () => {
          try {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) {
              if (!this.audioCtx) this.audioCtx = new Ctx();
              if (this.audioCtx.state === "suspended") this.audioCtx.resume();
            }
          } catch (e) {}

          try {
            const a = this._getAudio();
            if (a && !this.audioUnlocked) {
              this.audioUnlocked = true;
              a.muted = true;
              const p = a.play();
              if (p && typeof p.catch === "function") p.catch(() => {});
              a.pause();
              a.muted = false;
            }
          } catch (e) {}

          try {
            if (this._hasTTS()) {
              this._loadVoices();
              if (window.speechSynthesis.paused) window.speechSynthesis.resume();
            }
          } catch (e) {}

          window.removeEventListener("pointerdown", unlock);
          window.removeEventListener("touchstart", unlock);
          window.removeEventListener("click", unlock);
        };
        window.addEventListener("pointerdown", unlock, { passive: true });
        window.addEventListener("touchstart", unlock, { passive: true });
        window.addEventListener("click", unlock, { passive: true });
      }

      _notify(msg) {
        if (typeof this.onStatusChange === "function") {
          const def = this.mode === "auto"
            ? `Tự động (Online 3 tầng) • ${this.accent}`
            : `Giọng máy (TTS) • ${this.accent}`;
          this.onStatusChange(msg || def);
        }
      }

      setAccent(acc) { this.accent = acc; this._notify(); }
      setRate(r) { this.rate = r; }
      setMode(m) { this.mode = m; this._notify(); }

      _clearTimers() {
        this.activeTimers.forEach(id => clearTimeout(id));
        this.activeTimers = [];
      }

      stopAll() {
        this.seqToken += 1;
        this._clearTimers();
        try {
          const a = this.sharedAudio;
          if (a) {
            a.onplaying = null;
            a.onended = null;
            a.onerror = null;
            a.pause();
            a.currentTime = 0;
          }
        } catch (e) {}
        try {
          if (this._hasTTS()) window.speechSynthesis.cancel();
        } catch (e) {}
      }

      _playUrl(url, rateToUse, token) {
        return new Promise((resolve, reject) => {
          if (this.seqToken !== token) return resolve("cancelled");
          const a = this._getAudio();
          if (!a) return reject(new Error("no-audio"));

          let settled = false;
          let started = false;
          let endTimer = null;

          const cleanup = () => {
            clearTimeout(startTimer);
            clearTimeout(endTimer);
            a.onplaying = null;
            a.onended = null;
            a.onerror = null;
          };

          const ok = () => {
            if (settled) return;
            settled = true;
            cleanup();
            resolve("ok");
          };

          const fail = (reason) => {
            if (settled) return;
            settled = true;
            cleanup();
            try { a.pause(); } catch (e) {}
            reject(new Error(reason));
          };

          const startTimer = setTimeout(() => {
            if (!started) fail("timeout");
          }, 2500);
          this.activeTimers.push(startTimer);

          a.onplaying = () => {
            if (this.seqToken !== token) return ok();
            started = true;
            clearTimeout(startTimer);
            try { a.playbackRate = rateToUse; } catch (e) {}
            const dur = isFinite(a.duration) && a.duration > 0
              ? Math.round((a.duration * 1000) / Math.max(0.5, rateToUse)) + 500
              : 3800;
            endTimer = setTimeout(ok, dur);
            this.activeTimers.push(endTimer);
          };

          a.onended = ok;
          a.onerror = () => fail("audio-error");

          try {
            a.pause();
            a.src = url;
            a.playbackRate = rateToUse;
            a.load();
            const p = a.play();
            if (p && typeof p.catch === "function") p.catch(() => fail("play-rejected"));
          } catch (e) {
            fail("exception");
          }
        });
      }

      async _fetchDictUrl(word) {
        const clean = word.trim().toLowerCase().split(/\s+/)[0];
        const key = `${clean}|${this.accent}`;
        if (this.dictCache.has(key)) return this.dictCache.get(key);

        let ctrl = null;
        let timer = null;
        try {
          if (typeof AbortController !== "undefined") {
            ctrl = new AbortController();
            timer = setTimeout(() => ctrl.abort(), 2400);
            this.activeTimers.push(timer);
          }
          const res = await fetch(
            `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(clean)}`,
            ctrl ? { signal: ctrl.signal } : undefined
          );
          if (timer) clearTimeout(timer);
          if (!res.ok) { this.dictCache.set(key, null); return null; }
          const data = await res.json();
          const urls = [];
          if (Array.isArray(data)) {
            data.forEach(entry => {
              if (Array.isArray(entry.phonetics)) {
                entry.phonetics.forEach(ph => {
                  if (ph && ph.audio && ph.audio.startsWith("http")) urls.push(ph.audio);
                });
              }
            });
          }
          if (!urls.length) { this.dictCache.set(key, null); return null; }
          const wantUk = this.accent === "en-GB";
          const picked = urls.find(u => wantUk ? /uk|gb/i.test(u) : /us/i.test(u)) || urls[0];
          this.dictCache.set(key, picked);
          return picked;
        } catch (e) {
          if (timer) clearTimeout(timer);
          return null;
        }
      }

      _playTTS(text, rateToUse, token) {
        return new Promise((resolve) => {
          if (!this._hasTTS() || this.seqToken !== token) return resolve("no-tts");

          const tStart = setTimeout(() => {
            if (this.seqToken !== token) return resolve("cancelled");
            try {
              if (window.speechSynthesis.paused) window.speechSynthesis.resume();
              const utter = new SpeechSynthesisUtterance(text);
              utter.lang = this.accent;
              utter.rate = rateToUse;
              utter.pitch = 1.0;

              const list = this._loadVoices();
              if (list.length) {
                const target = this.accent.toLowerCase();
                const exact = list.filter(v => v.lang && v.lang.toLowerCase().replace("_", "-") === target);
                const best = exact.find(v => /google|natural|enhanced|samantha|daniel|aria|jenny/i.test(v.name))
                  || exact[0]
                  || list.find(v => v.lang && v.lang.toLowerCase().startsWith("en"));
                if (best) { utter.voice = best; utter.lang = best.lang; }
              }

              let done = false;
              const finish = () => {
                if (done) return;
                done = true;
                clearTimeout(fb);
                resolve("tts-ok");
              };

              utter.onend = finish;
              utter.onerror = finish;
              const est = Math.max(950, Math.round((text.length * 130 + 550) / Math.max(0.5, rateToUse)));
              const fb = setTimeout(finish, est);
              this.activeTimers.push(fb);

              window.speechSynthesis.speak(utter);
              const tRes = setTimeout(() => {
                try { if (window.speechSynthesis.paused) window.speechSynthesis.resume(); } catch (e) {}
              }, 90);
              this.activeTimers.push(tRes);
            } catch (e) {
              resolve("tts-err");
            }
          }, 60);
          this.activeTimers.push(tStart);
        });
      }

      async _speakInternal(text, customRate, token) {
        const rateToUse = customRate !== null ? customRate : this.rate;
        if (this.mode === "tts") {
          this._notify(`Giọng máy TTS • ${this.accent}`);
          await this._playTTS(text, rateToUse, token);
          return "Giọng máy (TTS)";
        }

        // Tier 1: Youdao Audio (US=2, UK=1)
        const typeParam = this.accent === "en-US" ? 2 : 1;
        const yUrl = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&type=${typeParam}`;
        try {
          const r1 = await this._playUrl(yUrl, rateToUse, token);
          if (r1 === "cancelled") return "cancelled";
          this._notify(`Online Audio (Tầng 1) • ${this.accent}`);
          return "Online Audio (Youdao)";
        } catch (e1) {
          if (this.seqToken !== token) return "cancelled";
        }

        // Tier 2: DictionaryAPI.dev MP3
        try {
          const dUrl = await this._fetchDictUrl(text);
          if (this.seqToken !== token) return "cancelled";
          if (dUrl) {
            const r2 = await this._playUrl(dUrl, rateToUse, token);
            if (r2 === "cancelled") return "cancelled";
            this._notify(`DictionaryAPI Audio (Tầng 2) • ${this.accent}`);
            return "DictionaryAPI MP3";
          }
        } catch (e2) {
          if (this.seqToken !== token) return "cancelled";
        }

        // Tier 3: Offline TTS fallback
        if (this._hasTTS()) {
          this._notify(`Giọng máy dự phòng (Tầng 3) • ${this.accent}`);
          await this._playTTS(text, rateToUse, token);
          return "Giọng máy dự phòng (TTS)";
        }
        return "failed";
      }

      speak(text, customRate = null, onDone = null) {
        this.stopAll();
        const tok = this.seqToken;
        this._speakInternal(text, customRate, tok).then((tier) => {
          if (this.seqToken === tok && typeof onDone === "function") onDone(tier);
        });
      }

      speakSequence(items, gapMs = 600, onComplete = null) {
        this.stopAll();
        if (!items || !items.length) {
          if (onComplete) onComplete();
          return;
        }
        const tok = this.seqToken;
        const step = async (idx) => {
          if (this.seqToken !== tok) return;
          if (idx >= items.length) {
            if (onComplete) onComplete();
            return;
          }
          const it = items[idx];
          if (typeof it.onStart === "function") it.onStart();
          await this._speakInternal(it.text, it.rate !== undefined ? it.rate : null, tok);
          if (typeof it.onEnd === "function") it.onEnd();
          if (this.seqToken !== tok) return;
          const t = setTimeout(() => step(idx + 1), gapMs);
          this.activeTimers.push(t);
        };
        step(0);
      }

      playSFX(type) {
        if (!this.sfxEnabled) return;
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          if (!this.audioCtx) this.audioCtx = new Ctx();
          if (this.audioCtx.state === "suspended") this.audioCtx.resume();
          const now = this.audioCtx.currentTime;
          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();
          osc.connect(gain);
          gain.connect(this.audioCtx.destination);

          if (type === "click") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(560, now);
            osc.frequency.exponentialRampToValueAtTime(720, now + 0.04);
            gain.gain.setValueAtTime(0.045, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.start(now); osc.stop(now + 0.055);
          } else if (type === "correct") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.08);
            osc.frequency.setValueAtTime(783.99, now + 0.16);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now); osc.stop(now + 0.32);
          } else if (type === "wrong") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(160, now + 0.18);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now); osc.stop(now + 0.22);
          }
        } catch (e) {}
      }
    }

    /* =========================================================================
     * 3. SPEAKING & SHADOWING ENGINE (LAZY, SAFE IN IFRAME & MOBILE)
     * ========================================================================= */
    const HOMOPHONES = [
      ["see", "sea"], ["meet", "meat"], ["sun", "son"], ["two", "too", "to"],
      ["for", "four"], ["right", "write"], ["know", "no"], ["buy", "by", "bye"],
      ["peace", "piece"], ["wear", "where"], ["hear", "here"], ["pear", "pair"],
      ["wait", "weight"], ["sail", "sale"], ["road", "rode"], ["whole", "hole"],
      ["wood", "would"], ["blue", "blew"], ["new", "knew"], ["one", "won"],
      ["ate", "eight"], ["weak", "week"], ["beat", "beet"], ["read", "red"],
      ["cell", "sell"], ["night", "knight"], ["not", "knot"], ["poor", "pour"],
      ["bare", "bear"], ["sew", "so", "sow"], ["toe", "tow"], ["mail", "male"],
      ["pain", "pane"], ["main", "mane"], ["gate", "gait"], ["heal", "heel"],
      ["steal", "steel"], ["cot", "caught"], ["soot", "suit"], ["naught", "not"],
      ["coat", "caught"], ["boat", "bought"], ["low", "law"], ["hole", "hall"],
      ["nose", "knows"], ["there", "their"], ["flower", "flour"]
    ];

    class SpeakingEngine {
      constructor() {
        this.recognition = null;
        this.isListening = false;
        this.mediaRecorder = null;
        this.mediaStream = null;
        this.isRecording = false;
        this.recTimer = null;
        this.chunks = [];
        this.lastRecordingUrl = null;
        this.playbackAudio = null;
      }

      isFileProto() {
        try { return window.location.protocol === "file:"; } catch (e) { return false; }
      }

      hasSR() {
        try {
          return !this.isFileProto() && Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);
        } catch (e) { return false; }
      }

      hasRecorder() {
        try {
          return !this.isFileProto() && Boolean(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && typeof MediaRecorder !== "undefined");
        } catch (e) { return false; }
      }

      norm(s) {
        return (s || "").toLowerCase().replace(/[^a-z\s]/g, " ").replace(/\s+/g, " ").trim();
      }

      isMatch(spoken, target, avoidWord = null) {
        const s = this.norm(spoken);
        const t = this.norm(target);
        if (!s || !t) return false;
        const toks = s.split(" ");
        if (s === t || toks.includes(t)) return true;

        const av = avoidWord ? this.norm(avoidWord) : null;
        for (const grp of HOMOPHONES) {
          if (grp.includes(t)) {
            const okWords = grp.filter(w => w !== av);
            if (okWords.some(w => s === w || toks.includes(w))) return true;
          }
        }
        return false;
      }

      evaluate(alts, targetWord, pairWord = null) {
        const clean = (alts || []).map(a => this.norm(a)).filter(Boolean);
        const heard = clean[0] || "";
        for (const a of clean) {
          if (this.isMatch(a, targetWord, pairWord)) return { status: "correct", heard };
        }
        if (pairWord) {
          for (const a of clean) {
            if (this.isMatch(a, pairWord, targetWord)) return { status: "pair_error", heard };
          }
        }
        return { status: "wrong", heard };
      }

      stopListening() {
        this.isListening = false;
        if (this.recognition) {
          try { this.recognition.abort(); } catch (e) {}
          this.recognition = null;
        }
      }

      startListening({ lang, targetWord, pairWord = null, onInterim, onResult, onError, onEnd }) {
        this.stopListening();
        speech.stopAll();

        if (!this.hasSR()) {
          const msg = this.isFileProto()
            ? "Trình duyệt chặn nhận diện giọng nói khi mở từ file://. Hãy mở qua HTTPS hoặc khung Preview."
            : "Trình duyệt hoặc khung xem trước hiện chưa hỗ trợ nhận diện giọng nói tự động.";
          if (onError) onError(msg);
          return false;
        }

        try {
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          const rec = new SR();
          rec.lang = lang || "en-US";
          rec.continuous = false;
          rec.interimResults = true;
          rec.maxAlternatives = 5;

          let gotFinal = false;
          let lastInterim = "";

          rec.onstart = () => { this.isListening = true; };
          rec.onresult = (ev) => {
            const res = ev.results[ev.results.length - 1];
            const alts = [];
            for (let i = 0; i < res.length; i++) {
              if (res[i] && res[i].transcript) alts.push(res[i].transcript);
            }
            if (res.isFinal) {
              gotFinal = true;
              if (onResult) onResult(this.evaluate(alts, targetWord, pairWord));
            } else {
              lastInterim = alts[0] || "";
              if (onInterim) onInterim(lastInterim);
            }
          };

          rec.onerror = (ev) => {
            this.isListening = false;
            const map = {
              "not-allowed": "Quyền Micro bị từ chối hoặc bị chặn trong khung xem trước.",
              "no-speech": "Chưa nghe thấy giọng nói. Hãy bấm lại và đọc rõ hơn.",
              "network": "Cần kết nối Internet để nhận diện giọng nói.",
              "audio-capture": "Không tìm thấy Micro trên thiết bị."
            };
            if (onError) onError(map[ev.error] || `Lỗi nhận diện: ${ev.error}`);
          };

          rec.onend = () => {
            this.isListening = false;
            if (!gotFinal && lastInterim && onResult) {
              onResult(this.evaluate([lastInterim], targetWord, pairWord));
            }
            if (onEnd) onEnd();
          };

          this.recognition = rec;
          rec.start();
          return true;
        } catch (e) {
          this.isListening = false;
          if (onError) onError("Không thể khởi động Micro trong môi trường hiện tại.");
          return false;
        }
      }

      async startRecording({ maxMs = 3500, onStart, onStop, onError }) {
        this.stopRecording();
        speech.stopAll();
        if (!this.hasRecorder()) {
          if (onError) onError("Thiết bị hoặc khung xem trước hiện chưa cho phép ghi âm Micro.");
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          this.mediaStream = stream;
          this.chunks = [];
          const rec = new MediaRecorder(stream);
          this.mediaRecorder = rec;

          rec.ondataavailable = (e) => { if (e.data && e.data.size > 0) this.chunks.push(e.data); };
          rec.onstop = () => {
            this.isRecording = false;
            clearTimeout(this.recTimer);
            if (this.mediaStream) {
              this.mediaStream.getTracks().forEach(t => t.stop());
              this.mediaStream = null;
            }
            if (this.chunks.length) {
              try { if (this.lastRecordingUrl) URL.revokeObjectURL(this.lastRecordingUrl); } catch (e) {}
              const blob = new Blob(this.chunks, { type: rec.mimeType || "audio/webm" });
              this.lastRecordingUrl = URL.createObjectURL(blob);
            }
            if (onStop) onStop(this.lastRecordingUrl);
          };

          rec.start();
          this.isRecording = true;
          if (onStart) onStart();
          this.recTimer = setTimeout(() => { if (this.isRecording) this.stopRecording(); }, maxMs);
        } catch (e) {
          this.isRecording = false;
          if (onError) onError("Không thể truy cập Micro (chưa cấp quyền hoặc bị chặn trong iframe).");
        }
      }

      stopRecording() {
        clearTimeout(this.recTimer);
        if (this.mediaRecorder && this.mediaRecorder.state !== "inactive") {
          try { this.mediaRecorder.stop(); } catch (e) {}
        }
        this.isRecording = false;
      }

      playComparison(word, onStep) {
        if (!this.lastRecordingUrl) return;
        speech.stopAll();
        if (!this.playbackAudio) {
          try { this.playbackAudio = new Audio(); } catch (e) { return; }
        }
        try { this.playbackAudio.pause(); } catch (e) {}

        if (onStep) onStep("model");
        speech.speak(word, null, () => {
          setTimeout(() => {
            if (onStep) onStep("user");
            try {
              this.playbackAudio.src = this.lastRecordingUrl;
              this.playbackAudio.onended = () => { if (onStep) onStep("done"); };
              this.playbackAudio.onerror = () => { if (onStep) onStep("done"); };
              const p = this.playbackAudio.play();
              if (p && typeof p.catch === "function") p.catch(() => { if (onStep) onStep("done"); });
            } catch (e) {
              if (onStep) onStep("done");
            }
          }, 350);
        });
      }
    }

    /* =========================================================================
     * 6. PARSER CHUYỂN ĐỔI DỮ LIỆU COMPACT -> OBJECTS & MASTER VOCAB (450+ TỪ)
     * ========================================================================= */
    function parseWordList(str) {
      return str.split(";").map(item => {
        const [word, ipa, vi] = item.split("|");
        return { word: word.trim(), ipa: ipa.trim(), vi: vi.trim() };
      });
    }

    const MINIMAL_PAIRS = RAW_15_PAIRS.map(p => ({
      id: p[0], cat: p[1], title: p[2],
      a: { sym: p[3], lbl: p[4], mouth: p[5] },
      b: { sym: p[6], lbl: p[7], mouth: p[8] },
      tip: p[9],
      pairs: p[10].split(";").map(row => {
        const [pa, pb] = row.split("=");
        const [wa, ia, va] = pa.split("|");
        const [wb, ib, vb] = pb.split("|");
        return {
          a: { word: wa.trim(), ipa: ia.trim(), vi: va.trim() },
          b: { word: wb.trim(), ipa: ib.trim(), vi: vb.trim() }
        };
      })
    }));

    const IPA_SOUNDS = RAW_44_IPA.map(s => ({
      id: s[0], symbol: s[1], group: s[2], sub: s[3],
      mouth: { tongue: s[4], lips: s[5], airflow: s[6] },
      spelling: s[7].split(",").map(x => x.trim()),
      distractors: s[8].split(",").map(x => x.trim()),
      examples: parseWordList(s[9]),
      relatedPairs: MINIMAL_PAIRS.filter(mp => mp.a.sym === s[1] || mp.b.sym === s[1]).map(mp => mp.id)
    }));

    // Bản đồ tra cứu nhanh cặp từ tối thiểu cho bất kỳ từ nào
    const WORD_PAIR_MAP = new Map();
    MINIMAL_PAIRS.forEach(p => {
      p.pairs.forEach(r => {
        const ka = r.a.word.toLowerCase();
        const kb = r.b.word.toLowerCase();
        if (!WORD_PAIR_MAP.has(ka)) WORD_PAIR_MAP.set(ka, { pair: p, side: "a", self: r.a, other: r.b });
        if (!WORD_PAIR_MAP.has(kb)) WORD_PAIR_MAP.set(kb, { pair: p, side: "b", self: r.b, other: r.a });
      });
    });

    // Hợp nhất & loại trùng toàn bộ từ vựng từ Tab 1 (352) + Tab 2 (240)
    const MASTER_VOCAB = (() => {
      const seen = new Map();
      IPA_SOUNDS.forEach(s => {
        s.examples.forEach(ex => {
          const k = ex.word.toLowerCase();
          if (!seen.has(k)) {
            seen.set(k, { word: ex.word, ipa: ex.ipa, vi: ex.vi, symbol: s.symbol, group: s.group });
          }
        });
      });
      MINIMAL_PAIRS.forEach(p => {
        const sA = IPA_SOUNDS.find(x => x.symbol === p.a.sym);
        const sB = IPA_SOUNDS.find(x => x.symbol === p.b.sym);
        p.pairs.forEach(r => {
          [
            { item: r.a, sound: sA, sym: p.a.sym },
            { item: r.b, sound: sB, sym: p.b.sym }
          ].forEach(({ item, sound, sym }) => {
            const k = item.word.toLowerCase();
            if (!seen.has(k)) {
              seen.set(k, {
                word: item.word, ipa: item.ipa, vi: item.vi,
                symbol: sym, group: sound ? sound.group : (p.cat === "vowel" ? "monophthong" : "voiced")
              });
            }
          });
        });
      });
      return Array.from(seen.values()).sort((a, b) => a.word.localeCompare(b.word));
    })();

    /* =========================================================================
     * 7. APPLICATION STATE & STATS PERSISTENCE (SAFE STORAGE)
     * ========================================================================= */
    const STATS_KEY = "ipa_master_stats_v3";

    function loadStats() {
      try {
        const raw = SafeStorage.get(STATS_KEY, "");
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            return {
              total: Number(parsed.total) || 0,
              correct: Number(parsed.correct) || 0,
              streak: Number(parsed.streak) || 0,
              bestStreak: Number(parsed.bestStreak) || 0,
              weak: parsed.weak && typeof parsed.weak === "object" ? parsed.weak : {}
            };
          }
        }
      } catch (e) {}
      return { total: 0, correct: 0, streak: 0, bestStreak: 0, weak: {} };
    }

    function saveStats() {
      try { SafeStorage.set(STATS_KEY, JSON.stringify(state.stats)); } catch (e) {}
    }

    function recordStat(key, label, isCorrect) {
      const st = state.stats;
      st.total += 1;
      if (isCorrect) {
        st.correct += 1;
        st.streak += 1;
        if (st.streak > st.bestStreak) st.bestStreak = st.streak;
      } else {
        st.streak = 0;
        if (!st.weak[key]) st.weak[key] = { label, wrong: 0 };
        st.weak[key].wrong += 1;
      }
      saveStats();
      renderQuizStats();
    }

    /* =========================================================================

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toastEl");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function escJs(str) {
      return String(str).replace(/\\/g, "\\\\").replace(/'/g, "\\'");

      }

    function playOneChartEx(soundId, idx, customRate) {
      const s = IPA_SOUNDS.find(x => x.id === soundId);
      if (!s || !s.examples[idx]) return;
      document.querySelectorAll(".ex-row.speaking").forEach(el => el.classList.remove("speaking"));
      const rows = document.querySelectorAll(`[id="chartEx-${soundId}-${idx}"]`);
      rows.forEach(r => r.classList.add("speaking"));
      speech.speak(s.examples[idx].word, customRate, () => {
        rows.forEach(r => r.classList.remove("speaking"));
      });
    }

    function playAllChartExamples(soundId) {
      const s = IPA_SOUNDS.find(x => x.id === soundId);
      if (!s) return;
      const items = s.examples.map((ex, idx) => ({
        text: ex.word,
        onStart: () => {
          document.querySelectorAll(".ex-row.speaking").forEach(el => el.classList.remove("speaking"));
          document.querySelectorAll(`[id="chartEx-${soundId}-${idx}"]`).forEach(r => r.classList.add("speaking"));
        },
        onEnd: () => {
          document.querySelectorAll(`[id="chartEx-${soundId}-${idx}"]`).forEach(r => r.classList.remove("speaking"));
        }
      }));
      showToast(`Đang đọc 8 từ mẫu của âm /${s.symbol}/...`);
      speech.speakSequence(items, 480);
    }

        state.selectedPairId = list[0].id;
      }
      renderPairSelector();
      renderPairDetail();
    }

      if (state.pairFilter === "all") return MINIMAL_PAIRS;
      return MINIMAL_PAIRS.filter(p => p.cat === state.pairFilter);

              <button type="button" class="mp-vs-btn" onclick="compareOnePair('${escJs(row.a.word)}', '${escJs(row.b.word)}', ${idx})">
                ▶ So sánh A → B

              <div class="mp-word-wrap">
                <button id="mpB-${idx}" type="button" class="mp-word-btn" onclick="speakPairCell('${escJs(row.b.word)}', 'mpB-${idx}', 'speaking-b')">

                    <div style="font-size:15.5px;font-weight:800;">${row.b.word} <span class="ipa" style="font-size:13px;color:var(--c-diph-tx);">${row.b.ipa}</span></div>
                    <div style="font-size:12px;color:var(--text-muted);">${row.b.vi}</div>
                  </div>
                  <span>🔊</span>
                </button>
                <button type="button" class="btn-mini mic" onclick="openQuickMic('${escJs(row.b.word)}', '${escJs(row.b.ipa)}', '${escJs(row.b.vi)}', '${p.id}', 'b')" title="Kiểm tra đọc ${row.b.word}">🎤</button>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function clearPairHighlights() {
      document.querySelectorAll(".mp-word-btn.speaking-a, .mp-word-btn.speaking-b").forEach(el => {
        el.classList.remove("speaking-a", "speaking-b");
      });
    }

    function speakPairCell(word, elId, cls) {
      clearPairHighlights();
      const el = document.getElementById(elId);
      if (el) el.classList.add(cls);
      speech.speak(word, null, () => { if (el) el.classList.remove(cls); });
    }

    function compareOnePair(wordA, wordB, idx) {
      speech.speakSequence([
        {
          text: wordA,
          onStart: () => { clearPairHighlights(); const e = document.getElementById(`mpA-${idx}`); if (e) e.classList.add("speaking-a"); },
          onEnd: () => { const e = document.getElementById(`mpA-${idx}`); if (e) e.classList.remove("speaking-a"); }
        },
        {
          text: wordB,
          onStart: () => { const e = document.getElementById(`mpB-${idx}`); if (e) e.classList.add("speaking-b"); },
          onEnd: () => { const e = document.getElementById(`mpB-${idx}`); if (e) e.classList.remove("speaking-b"); }
        }
      ], 600);
    }

    function playAllPairRows(pairId) {
      const p = MINIMAL_PAIRS.find(x => x.id === pairId);
      if (!p) return;
      const seq = [];
      p.pairs.forEach((row, idx) => {
        seq.push({
          text: row.a.word,
          onStart: () => { clearPairHighlights(); const e = document.getElementById(`mpA-${idx}`); if (e) e.classList.add("speaking-a"); },
          onEnd: () => { const e = document.getElementById(`mpA-${idx}`); if (e) e.classList.remove("speaking-a"); }
        });
        seq.push({
          text: row.b.word,
          onStart: () => { const e = document.getElementById(`mpB-${idx}`); if (e) e.classList.add("speaking-b"); },
          onEnd: () => { const e = document.getElementById(`mpB-${idx}`); if (e) e.classList.remove("speaking-b"); }
        });
      });
      showToast(`Đang đọc lần lượt 8 cặp của ${p.title}...`);
      speech.speakSequence(seq, 600);
    }

    function drillPairInQuiz(pairId) {
      state.quizMode = "minimal";
      state.quizFilter = pairId;
      state.quizDeck = [];
      state.currentQ = null;
      ["minimal", "symbol", "trans", "speaking"].forEach(m => {
        document.getElementById(`qMode-${m}`).classList.toggle("active", m === "minimal");
      });
      renderQuizFilterOptions();
      switchTab("quiz");
      nextQuizQuestion(true);
    }

    /* =========================================================================
     * 11. TAB 3: LUYỆN TAI & LUYỆN NÓI (4 CHẾ ĐỘ + THỐNG KÊ ĐIỂM YẾU)
     * ========================================================================= */
    function setQuizMode(mode) {
      speaker.stopListening();
      speaker.stopRecording();
      state.quizMode = mode;
      state.quizFilter = "all";
      state.quizDeck = [];
      ["minimal", "symbol", "trans", "speaking"].forEach(m => {
        document.getElementById(`qMode-${m}`).classList.toggle("active", m === mode);
      });
      renderQuizFilterOptions();
      speech.playSFX("click");
      nextQuizQuestion(mode !== "speaking");
    }

    function setQuizFilter(val) {
      speaker.stopListening();
      speaker.stopRecording();
      state.quizFilter = val;
      state.quizDeck = [];
      nextQuizQuestion(state.quizMode !== "speaking");
    }

    function renderQuizFilterOptions() {
      const sel = document.getElementById("quizFilterSelect");
      if (state.quizMode === "minimal" || state.quizMode === "speaking") {
        sel.innerHTML = `
          <option value="all">Tất cả 15 cặp (120 cặp từ)</option>
          <option value="vowel">Chỉ 7 cặp Nguyên âm</option>
          <option value="consonant">Chỉ 8 cặp Phụ âm</option>
          ${MINIMAL_PAIRS.map(p => `<option value="${p.id}">Cày sâu: ${p.title}</option>`).join("")}
          ${state.quizMode === "speaking" ? `<option value="vocab_all">Toàn bộ kho (${MASTER_VOCAB.length} từ)</option>` : ""}
        `;
      } else {
        sel.innerHTML = `
          <option value="all">Tất cả 44 âm (${MASTER_VOCAB.length} từ)</option>
          <option value="monophthong">Nguyên âm đơn (12 âm)</option>
          <option value="diphthong">Nguyên âm đôi (8 âm)</option>
          <option value="voiceless">Phụ âm vô thanh (9 âm)</option>
          <option value="voiced">Phụ âm hữu thanh (15 âm)</option>
        `;
      }
      sel.value = state.quizFilter;
    }

    function getWeakestPair() {
      const entries = Object.entries(state.stats.weak || {})
        .filter(([k]) => MINIMAL_PAIRS.some(p => p.id === k))
        .sort((a, b) => b[1].wrong - a[1].wrong);
      return entries.length ? { id: entries[0][0], label: entries[0][1].label, wrong: entries[0][1].wrong } : null;
    }

    function renderQuizStats() {
      const st = state.stats;
      const acc = st.total ? Math.round((st.correct / st.total) * 100) : 0;
      const weakest = getWeakestPair();
      document.getElementById("quizStatsMount").innerHTML = `
        <span class="stat-pill">🔥 Chuỗi: ${st.streak}</span>
        <span class="stat-pill">🎯 Đúng: ${acc}% (${st.correct}/${st.total})</span>
        ${weakest ? `<button type="button" class="pill-btn" style="background:var(--c-warn-bg);border-color:var(--c-warn-bd);color:#92400e;" onclick="drillPairInQuiz('${weakest.id}')">⚡ Luyện cặp yếu nhất (${weakest.label})</button>` : ""}
      `;
    }

    function refillQuizDeck() {
      if (state.quizMode === "minimal" || state.quizMode === "speaking") {
        if (state.quizMode === "speaking" && state.quizFilter === "vocab_all") {
          state.quizDeck = shuffle(MASTER_VOCAB.map(w => ({ vocabOnly: w })));
          return;
        }
        let pairs = MINIMAL_PAIRS;
        if (state.quizFilter === "vowel") pairs = MINIMAL_PAIRS.filter(p => p.cat === "vowel");
        else if (state.quizFilter === "consonant") pairs = MINIMAL_PAIRS.filter(p => p.cat === "consonant");
        else if (state.quizFilter !== "all") pairs = MINIMAL_PAIRS.filter(p => p.id === state.quizFilter);

        const items = [];
        pairs.forEach(p => p.pairs.forEach(row => items.push({ pair: p, row })));
        state.quizDeck = shuffle(items);
      } else if (state.quizMode === "symbol") {
        const sounds = state.quizFilter === "all" ? IPA_SOUNDS : IPA_SOUNDS.filter(s => s.group === state.quizFilter);
        const items = [];
        sounds.forEach(s => s.examples.forEach(ex => items.push({ sound: s, ex })));
        state.quizDeck = shuffle(items);
      } else {
        const list = state.quizFilter === "all" ? MASTER_VOCAB : MASTER_VOCAB.filter(w => w.group === state.quizFilter);
        state.quizDeck = shuffle(list);
      }
    }

    function generateFakeIPAs(correctIpa) {
      const swaps = [
        ["iː", "ɪ"], ["ɪ", "iː"], ["uː", "ʊ"], ["ʊ", "uː"], ["æ", "e"], ["e", "æ"],
        ["ɑː", "ʌ"], ["ʌ", "ɑː"], ["ɔː", "ɒ"], ["ɒ", "ɔː"], ["eɪ", "e"], ["əʊ", "ɔː"],
        ["θ", "s"], ["ð", "d"], ["ʃ", "s"], ["tʃ", "ʃ"], ["p", "b"], ["t", "d"], ["l", "n"], ["r", "l"]
      ];
      const set = new Set();
      for (const [from, to] of shuffle(swaps)) {
        if (correctIpa.includes(from)) {
          const fake = correctIpa.replace(from, to);
          if (fake !== correctIpa) set.add(fake);
        }
        if (set.size >= 3) break;
      }
      const pool = shuffle(MASTER_VOCAB);
      for (const w of pool) {
        if (set.size >= 3) break;
        if (w.ipa !== correctIpa) set.add(w.ipa);
      }
      return Array.from(set).slice(0, 3);
    }

    function nextQuizQuestion(autoSpeak = true) {
      speaker.stopListening();
      speaker.stopRecording();
      if (!state.quizDeck.length) refillQuizDeck();
      const item = state.quizDeck.pop();
      state.answered = false;
      state.pickedIdx = null;
      state.speakingResult = null;
      state.speakingInterim = "";
      state.speakingError = "";

      if (state.quizMode === "minimal") {
        const { pair, row } = item;
        const pickA = Math.random() < 0.5;
        const target = pickA ? row.a : row.b;
        const other = pickA ? row.b : row.a;
        const opts = shuffle([
          { word: row.a.word, ipa: row.a.ipa, vi: row.a.vi, sym: pair.a.sym, correct: pickA },
          { word: row.b.word, ipa: row.b.ipa, vi: row.b.vi, sym: pair.b.sym, correct: !pickA }
        ]);
        state.currentQ = {
          mode: "minimal",
          statKey: pair.id,
          statLabel: pair.title,
          tag: `Phân biệt cặp ${pair.title}`,
          targetWord: target.word,
          pair, row, target, other,
          options: opts
        };
      } else if (state.quizMode === "symbol") {
        const { sound, ex } = item;
        const sameGroup = IPA_SOUNDS.filter(s => s.group === sound.group && s.symbol !== sound.symbol).map(s => s.symbol);
        const dists = [];
        sound.distractors.forEach(d => { if (d !== sound.symbol && !dists.includes(d)) dists.push(d); });
        shuffle(sameGroup).forEach(d => { if (dists.length < 3 && !dists.includes(d)) dists.push(d); });
        const opts = shuffle([sound.symbol, ...dists.slice(0, 3)]).map(sym => ({
          sym, correct: sym === sound.symbol
        }));
        state.currentQ = {
          mode: "symbol",
          statKey: sound.id,
          statLabel: `/${sound.symbol}/`,
          tag: "Nghe từ & chọn ký hiệu IPA chứa trong từ",
          targetWord: ex.word,
          ex, sound,
          options: opts
        };
      } else if (state.quizMode === "trans") {
        const w = item;
        const fakes = generateFakeIPAs(w.ipa);
        const opts = shuffle([w.ipa, ...fakes]).map(ipa => ({ ipa, correct: ipa === w.ipa }));
        state.currentQ = {
          mode: "trans",
          statKey: w.symbol,
          statLabel: `Phiên âm /${w.symbol}/`,
          tag: "Nghe từ & chọn đúng phiên âm IPA",
          targetWord: w.word,
          wordObj: w,
          options: opts
        };
      } else {
        if (item.vocabOnly) {
          const w = item.vocabOnly;
          const mapped = WORD_PAIR_MAP.get(w.word.toLowerCase()) || null;
          state.currentQ = {
            mode: "speaking",
            statKey: mapped ? mapped.pair.id : w.symbol,
            statLabel: mapped ? mapped.pair.title : `Đọc /${w.symbol}/`,
            tag: mapped ? `Luyện nói cặp ${mapped.pair.title}` : `Luyện nói âm /${w.symbol}/`,
            targetWord: w.word, targetIpa: w.ipa, targetVi: w.vi, pairInfo: mapped
          };
        } else {
          const { pair, row } = item;
          const pickA = Math.random() < 0.5;
          const self = pickA ? row.a : row.b;
          const other = pickA ? row.b : row.a;
          state.currentQ = {
            mode: "speaking",
            statKey: pair.id,
            statLabel: pair.title,
            tag: `Luyện nói cặp ${pair.title}`,
            targetWord: self.word, targetIpa: self.ipa, targetVi: self.vi,
            pairInfo: { pair, side: pickA ? "a" : "b", self, other }
          };
        }
      }

      renderQuizStage();
      if (autoSpeak && state.currentQ.mode !== "speaking") {
        setTimeout(() => speech.speak(state.currentQ.targetWord), 120);
      }
    }

    function answerQuiz(idx) {
      if (state.answered || !state.currentQ) return;
      state.answered = true;
      state.pickedIdx = idx;
      const opt = state.currentQ.options[idx];
      const isOk = Boolean(opt && opt.correct);
      speech.playSFX(isOk ? "correct" : "wrong");
      recordStat(state.currentQ.statKey, state.currentQ.statLabel, isOk);
      renderQuizStage();
    }

    function buildSpeakingDiagnosisHTML(targetWord, targetIpa, pairInfo, result) {
      if (!result) return "";
      if (result.status === "correct") {
        return `
          <div class="quiz-feedback fb-ok">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
              <strong>✅ Tuyệt vời! Bạn phát âm chuẩn "${targetWord}"</strong>
              <span class="heard-chip">Máy nghe: "${result.heard}"</span>
            </div>
            ${pairInfo ? `<div style="font-size:12.5px;">Phân biệt rất tốt cặp <strong class="ipa">${pairInfo.pair.title}</strong>!</div>` : ""}
          </div>
        `;
      }
      if (result.status === "pair_error" && pairInfo) {
        const p = pairInfo.pair;
        const exp = pairInfo.side === "a" ? p.a : p.b;
        const conf = pairInfo.side === "a" ? p.b : p.a;
        return `
          <div class="quiz-feedback fb-err">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
              <strong>⚠️ Nhầm cặp âm <span class="ipa">${p.title}</span>!</strong>
              <span class="heard-chip">Máy nghe: "${result.heard}"</span>
            </div>
            <div style="background:#fff;padding:10px 12px;border-radius:10px;color:var(--text-main);font-size:13px;">
              Máy nghe thành <strong>${pairInfo.other.word}</strong> (<span class="ipa">/${conf.sym}/</span> — ${conf.lbl}) thay vì <strong>${targetWord}</strong> (<span class="ipa">/${exp.sym}/</span> — ${exp.lbl}).
              <div style="margin-top:5px;">👄 <strong>Chỉnh khẩu hình /${exp.sym}/:</strong> ${exp.mouth}</div>
              <div style="margin-top:4px;color:#92400e;">💡 ${p.tip}</div>
            </div>
            <div>
              <button type="button" class="btn-primary" onclick="speech.speakSequence([{text:'${escJs(targetWord)}'},{text:'${escJs(pairInfo.other.word)}'}], 600)">
                ▶ So sánh A → B (${targetWord} → ${pairInfo.other.word})
              </button>
            </div>
          </div>
        `;
      }
      return `
        <div class="quiz-feedback fb-err">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
            <strong>❌ Chưa thật rõ — Thử đọc lại nhé!</strong>
            <span class="heard-chip">Máy nghe: "${result.heard || "(không rõ)"}"</span>
          </div>
          <div style="font-size:12.5px;">Mục tiêu: <strong>${targetWord}</strong> <span class="ipa">${targetIpa}</span>. Hãy bấm <strong>🐢 0.65x</strong> để nghe chậm rồi đọc lại.</div>
        </div>
      `;
    }

    function renderQuizStage() {
      const q = state.currentQ;
      const mount = document.getElementById("quizStageMount");
      if (!q) return;

      const audioBar = `
        <div class="quiz-audio-row">
          <button type="button" class="btn-primary" onclick="speech.speak('${escJs(q.targetWord)}')">🔊 Nghe từ</button>

          <div class="quiz-options-2">
            ${q.options.map((opt, idx) => {

              return `

                  <span style="font-size:12px;color:var(--text-muted);">${opt.vi}</span>
                </button>
              `;
            }).join("")}
          </div>
        `;
        if (state.answered) {
          const isOk = q.options[state.pickedIdx].correct;
          html += `

            </div>

        }

          <span class="quiz-tag">${q.tag}</span>
          <div class="quiz-big-word">${state.answered ? q.ex.word : "🔊 ???"}</div>
          <div style="font-size:13.5px;color:var(--text-muted);">${state.answered ? `${q.ex.ipa} — ${q.ex.vi}` : "Bấm Nghe từ rồi chọn ký hiệu IPA đúng"}</div>
          ${audioBar}
          <div class="quiz-options-4">
            ${q.options.map((opt, idx) => {
              let cls = "";
              if (state.answered) {
                if (opt.correct) cls = "correct";
                else if (idx === state.pickedIdx) cls = "wrong";
              }
              return `
                <button type="button" class="opt-btn ${cls}" ${state.answered ? "disabled" : ""} onclick="answerQuiz(${idx})">
                  <span class="ipa" style="font-size:26px;font-weight:800;">/${opt.sym}/</span>
                </button>
              `;
            }).join("")}
          </div>
        `;
        if (state.answered) {
          const isOk = q.options[state.pickedIdx].correct;
          html += `
            <div class="quiz-feedback ${isOk ? "fb-ok" : "fb-err"}">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
                <strong>${isOk ? "✅ Chuẩn xác!" : "❌ Chưa đúng!"} ${q.ex.word} chứa âm /${q.sound.symbol}/</strong>
                <button type="button" class="${isOk ? "btn-success" : "btn-primary"}" onclick="nextQuizQuestion(true)">Câu tiếp theo →</button>
              </div>
              <div style="font-size:12.5px;">👄 ${q.sound.mouth.lips} ${q.sound.mouth.tongue}</div>
            </div>
          `;

      } else if (q.mode === "trans") {

          <span class="quiz-tag">${q.tag}</span>
